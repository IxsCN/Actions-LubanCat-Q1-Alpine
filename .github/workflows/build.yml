name: Build LubanCat Q1 Alpine SD image
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu build-essential \
            bc bison flex libssl-dev libelf-dev dwarves device-tree-compiler \
            u-boot-tools qemu-user-static binfmt-support e2fsprogs git curl \
            python3 cpio rsync zstd liblz4-tool gdisk
          pahole --version
      - name: Install Python 2 for vendor U-Boot
        run: |
          curl -fLsS https://micro.mamba.pm/api/micromamba/linux-64/latest -o /tmp/micromamba.tar.bz2
          sudo tar xjf /tmp/micromamba.tar.bz2 -C /usr/local bin/micromamba --strip-components=1
          sudo micromamba create -y -p /opt/q1-python2 -c conda-forge python=2.7
          sudo ln -s /opt/q1-python2/bin/python2.7 /usr/local/bin/python2
          python2 --version
      - name: Build image
        run: sudo -E bash scripts/build-image.sh
      - name: Check GPT partitions and embedded images
        run: |
          image=$(ls dist/*.img.gz)
          gzip -t "$image"
          ls -lh "$image"
      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: lubancat-q1-alpine-sd
          path: dist/*.img.gz
          if-no-files-found: error
          retention-days: 14
