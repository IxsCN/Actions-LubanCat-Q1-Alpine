name: Build LubanCat Q1 Alpine SD image
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      # Vendor U-Boot's make.sh still requires a Python 2 executable.
      - uses: actions/setup-python@v5
        with:
          python-version: '2.7'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu build-essential \
            bc bison flex libssl-dev libelf-dev dwarves device-tree-compiler \
            u-boot-tools qemu-user-static binfmt-support e2fsprogs git curl \
            python3 cpio rsync zstd liblz4-tool gdisk
          pahole --version
      - name: Build image
        run: sudo -E bash scripts/build-image.sh
      - name: Check GPT partitions and embedded images
        run: |
          image=$(ls dist/*.img.gz)
          gzip -t "$image"
          ls -lh "$image"
      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: lubancat-q1-alpine-sd
          path: dist/*.img.gz
          if-no-files-found: error
          retention-days: 14
